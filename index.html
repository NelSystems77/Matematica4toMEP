<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Práctica interactiva de Matemática para 4.º grado (MEP Costa Rica): sucesiones, estadística, fracciones, decimales y cuadriláteros, con estilo de carreras de karts.">
<meta name="theme-color" content="#1e88e5">
<title>Mate Kart 4.º – Práctica MEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#1e88e5; --sky-d:#0d47a1; --sky-l:#e3f2fd;
  --sun:#ffc107; --sun-d:#e65100;
  --ok:#2e7d32; --ok-bg:#e8f5e9;
  --no:#6a1b9a; --no-bg:#f3e5f5;
  --ink:#16213e; --ink-2:#44506b; --card:#ffffff; --line:#c5d3ea;
  --c-suc:#fb8c00; --c-est:#43a047; --c-fra:#e91e63; --c-dec:#1e88e5; --c-cua:#7e57c2; --c-fin:#f9a825;
  --fs:18px;
}
html.hc{ --sky:#0b3d91; --sky-d:#000; --ink:#000; --ink-2:#000; --line:#000; --sky-l:#fff; --ok-bg:#fff; --no-bg:#fff; }
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.5;
  background:linear-gradient(180deg,#4fc3f7 0,#b3e5fc 38%,#e8f5e9 100%) fixed;min-height:100vh}
html.hc body{background:#fff}
a{color:var(--sky-d)}
:focus-visible{outline:4px solid #ff6f00;outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
header.top{background:linear-gradient(90deg,#0d47a1,#1e88e5);color:#fff;position:relative;padding-bottom:12px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/12px 12px}
header.top .in{max-width:1000px;margin:auto;padding:.7rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.5rem;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;background:none;border:0;color:#fff;font-family:inherit;padding:0}
.logo small{display:block;font-size:.6rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.grow{flex:1}
.pill{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:.2rem .8rem;font-weight:600;font-size:.9rem}
.iconbtn{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:12px;min-width:44px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}
.iconbtn[aria-pressed=true]{background:#ffc107;color:#222;border-color:#fff}
main{max-width:1000px;margin:0 auto;padding:1rem 1rem 3rem}
h1,h2,h3{line-height:1.2;margin:.2rem 0 .6rem}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:1.1rem 1.2rem;box-shadow:0 6px 0 rgba(13,71,161,.18);margin:1rem 0}
html.hc .card{border-color:#000}
.hero{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}
.hero .kart{font-size:5rem;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18));animation:vroom 2.6s ease-in-out infinite}
@keyframes vroom{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(14px) rotate(-3deg)}}
.rm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:16px;padding:.75rem 1.2rem;min-height:48px;cursor:pointer;color:#fff;
  background:var(--sky);box-shadow:0 6px 0 var(--sky-d);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.btn.go{background:var(--ok);box-shadow:0 6px 0 #1b5e20}
.btn.gold{background:var(--sun);color:#3e2723;box-shadow:0 6px 0 #b28704}
.btn.ghost{background:#fff;color:var(--sky-d);border:3px solid var(--sky-d);box-shadow:0 5px 0 var(--sky-d)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.cups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.cup{border-radius:24px;padding:1rem 1.1rem;color:#fff;text-align:left;border:0;font:inherit;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 8px 0 rgba(0,0,0,.25);min-height:150px;display:flex;flex-direction:column;gap:.2rem}
.cup:hover{filter:brightness(1.06)} .cup:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.cup .ic{font-size:2.4rem;line-height:1}
.cup b{font-size:1.2rem} .cup span.s{font-size:.88rem;opacity:.95}
.cup .stars{margin-top:auto;font-size:1.1rem;letter-spacing:2px;background:rgba(0,0,0,.2);border-radius:999px;padding:.1rem .7rem;align-self:flex-start}
.cup.suc{background:var(--c-suc)} .cup.est{background:var(--c-est)} .cup.fra{background:var(--c-fra)}
.cup.dec{background:var(--c-dec)} .cup.cua{background:var(--c-cua)} .cup.fin{background:linear-gradient(135deg,#f9a825,#ef6c00)}
html.hc .cup{background:#000!important}
.badge{display:inline-block;border-radius:999px;padding:.05rem .7rem;font-size:.8rem;font-weight:700;background:var(--sky-l);color:var(--sky-d);border:2px solid var(--sky)}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem}
.lvbtn{background:#fff;border:3px solid var(--line);border-radius:18px;padding:.9rem 1rem;font:inherit;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 rgba(13,71,161,.18)}
.lvbtn:hover{border-color:var(--sky)} .lvbtn b{display:block;font-size:1.1rem}
.lesson ul{padding-left:1.2rem;margin:.3rem 0} .lesson li{margin:.35rem 0}
.tip{background:#fff8e1;border-left:8px solid var(--sun);padding:.6rem .9rem;border-radius:12px;margin:.6rem 0}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}
.defs>div{background:var(--sky-l);border-radius:14px;padding:.55rem .8rem;border:2px solid var(--line)}
/* race */
.hud{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.track{position:relative;height:56px;margin:.6rem 0 1rem;border-radius:999px;background:#37474f;border:4px solid #263238;overflow:hidden}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#ffeb3b 0 22px,transparent 22px 44px)}
.track .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.7rem}
.track .k{position:absolute;top:50%;font-size:2rem;transform:translate(-8%,-52%);transition:left .6s cubic-bezier(.3,1.4,.5,1);filter:hue-rotate(var(--hue,0deg))}
.track .coin{position:absolute;top:50%;transform:translateY(-50%);font-size:1.1rem}
.qtag{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.qtext{font-size:1.25rem;font-weight:600;margin:.2rem 0 .8rem;outline:none}
.fig{width:100%;max-width:560px;height:auto;display:block;margin:.4rem auto .8rem;background:#fbfdff;border:2px dashed var(--line);border-radius:14px;padding:.3rem}
.svgt{font:600 13px "Fredoka",sans-serif;fill:#16213e}
.svgs{font:600 12px "Fredoka",sans-serif;fill:#44506b}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.7rem}
.ch{font:inherit;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:.7rem .9rem;cursor:pointer;color:var(--ink);
  min-height:56px;display:flex;gap:.7rem;align-items:center;box-shadow:0 5px 0 rgba(13,71,161,.18)}
.ch .l{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:700}
.ch:hover:not([disabled]){border-color:var(--sky);transform:translateY(-1px)}
.ch.right{background:var(--ok-bg);border-color:var(--ok)} .ch.right .l{background:var(--ok)}
.ch.wrong{background:var(--no-bg);border-color:var(--no)} .ch.wrong .l{background:var(--no)}
.ch[disabled]{cursor:default}
.ans{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.ans label{display:block;font-weight:600;width:100%}
.ans input{font:inherit;font-size:1.3rem;padding:.6rem .8rem;border:3px solid var(--sky);border-radius:14px;width:min(100%,260px);min-height:52px}
.hint{font-size:.85rem;color:var(--ink-2);width:100%}
.fb{margin-top:1rem;border-radius:18px;padding:.9rem 1.1rem;border:3px solid;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.no{background:var(--no-bg);border-color:var(--no)}
.fb h3{margin:0 0 .3rem}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-weight:700}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 .25em .05em}
.fr>span:last-child{padding-top:.05em}
/* tables */
table.tbl{border-collapse:collapse;margin:.4rem auto .8rem;min-width:min(100%,320px);background:#fff}
table.tbl caption{font-weight:700;padding:.3rem;caption-side:top}
table.tbl th,table.tbl td{border:2px solid var(--sky-d);padding:.35rem .8rem;text-align:center}
table.tbl thead th{background:var(--sky);color:#fff}
.picto{max-width:560px;margin:.4rem auto .8rem;background:#fbfdff;border:2px dashed var(--line);border-radius:14px;padding:.5rem}
.picto table{border-collapse:collapse;width:100%} .picto th{text-align:left;padding:.2rem .5rem;white-space:nowrap}
.picto td{font-size:1.4rem;padding:.2rem .5rem;border-bottom:1px solid var(--line)}
.picto .legend{margin:.3rem .5rem;font-weight:600;font-size:.9rem}
/* result */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:.6rem;margin:1rem 0}
.podium div{border-radius:14px 14px 0 0;padding:.4rem .9rem;text-align:center;font-weight:700;color:#3e2723;min-width:92px}
.podium .p1{background:#ffd54f;height:130px;order:2} .podium .p2{background:#cfd8dc;height:100px;order:1} .podium .p3{background:#ffab91;height:80px;order:3}
.podium .me{outline:5px solid var(--sky-d)}
.big{font-size:3rem;text-align:center}
.rev{border-left:8px solid var(--no);background:#fff;padding:.6rem .9rem;border-radius:12px;margin:.6rem 0;border-top:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
/* audit */
table.aud{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
table.aud th,table.aud td{border:2px solid var(--line);padding:.35rem .5rem;vertical-align:top}
table.aud thead th{background:var(--sky);color:#fff;position:sticky;top:0}
.okc{color:var(--ok);font-weight:700}
.scroll{overflow-x:auto}
footer{text-align:center;padding:1rem;font-size:.85rem;color:var(--ink-2)}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .kart{font-size:3.5rem}h1{font-size:1.6rem}}
</style>
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<header class="top">
  <div class="in">
    <button class="logo" id="logo" aria-label="Ir al inicio: Mate Kart 4.º">🏁 MATE KART<small>4.º grado · Práctica MEP</small></button>
    <span class="grow"></span>
    <span class="pill" id="coins" aria-live="polite">🪙 0</span>
    <button class="iconbtn" id="bSnd" aria-pressed="true" title="Sonido" aria-label="Sonido activado">🔊</button>
    <button class="iconbtn" id="bSmall" title="Letra más pequeña" aria-label="Reducir tamaño de letra">A−</button>
    <button class="iconbtn" id="bBig" title="Letra más grande" aria-label="Aumentar tamaño de letra">A+</button>
    <button class="iconbtn" id="bHc" aria-pressed="false" title="Alto contraste" aria-label="Alto contraste">HC</button>
    <button class="iconbtn" id="bRm" aria-pressed="false" title="Reducir movimiento" aria-label="Reducir movimiento">🐢</button>
  </div>
</header>
<main id="app" tabindex="-1"><noscript>Esta práctica necesita JavaScript activado.</noscript></main>
<footer>Práctica de estudio basada en los "Temas de Examen Segunda Prueba, II semestre 2026" · Matemática 4.º · Escuela San Rafael de Coronado</footer>

<script>
/* =========================================================
   1. TEMARIO OFICIAL (para la auditoría de cobertura)
   ========================================================= */
const OUT = {
 S1:{t:'suc',src:'Aprendizaje esperado',x:'Analizar patrones en sucesiones con figuras, representaciones geométricas y en tablas de números naturales menores que 1 000 000.'},
 S2:{t:'suc',src:'Aprendizaje esperado',x:'Aplicar sucesiones y patrones para resolver problemas contextualizados.'},
 S3:{t:'suc',src:'Indicador',x:'Identifica sucesiones numéricas y los patrones que se presentan para resolverlas, completando los términos faltantes en cada una.'},
 E1:{t:'est',src:'Aprendizaje esperado 1',x:'Interpretar información resumida en dibujos, diagramas, cuadros y gráficos en diferentes contextos.'},
 E2:{t:'est',src:'Aprendizaje esperado 2',x:'Identificar diferencias entre datos cuantitativos, según las estrategias de recolección: por conteo o por medición.'},
 E3:{t:'est',src:'Indicador 1',x:'Interpreta información estadística presentada en tablas y diferentes tipos de gráficos.'},
 E4:{t:'est',src:'Indicador 1',x:'Identifica datos cuantitativos y cualitativos.'},
 E5:{t:'est',src:'Indicador 1',x:'Reconoce las fuentes utilizadas para obtener la información, así como posibles errores en los datos recolectados.'},
 F1:{t:'fra',src:'Aprendizaje esperado 1',x:'Identificar las fracciones como parte de la unidad o parte de una colección de objetos.'},
 F2:{t:'fra',src:'Aprendizaje esperado 2',x:'Analizar las fracciones propias.'},
 F3:{t:'fra',src:'Aprendizaje esperado 3',x:'Comparar las fracciones propias utilizando los símbolos <, > o =.'},
 F4:{t:'fra',src:'Indicador 2',x:'Identifica y representa fracciones sencillas en forma gráfica, reconociendo numerador, denominador y la relación entre las partes de un entero y la fracción que representan.'},
 F5:{t:'fra',src:'Indicador 3',x:'Escribe y representa correctamente fracciones a partir de situaciones, cantidades y representaciones gráficas, identificando numerador y denominador.'},
 F6:{t:'fra',src:'Indicador 4',x:'Compara dos o más fracciones con los signos mayor que, menor que e igual, apoyándose en representaciones gráficas y en el análisis del numerador y denominador.'},
 F7:{t:'fra',src:'Indicador 5',x:'Identifica, representa y clasifica fracciones propias e impropias a partir de la relación entre numerador y denominador (representaciones gráficas y numéricas).'},
 D1:{t:'dec',src:'Aprendizaje esperado + Indicador 6',x:'Leer y escribir números en su representación decimal hasta la milésima, identificando sus partes: décimas, centésimas y milésimas.'},
 D2:{t:'dec',src:'Indicador 7',x:'Lee y escribe números decimales identificando su parte entera y su parte decimal.'},
 D3:{t:'dec',src:'Aprendizaje esperado',x:'Establecer entre cuáles números naturales consecutivos se encuentra un número decimal al localizarlo en la recta numérica.'},
 D4:{t:'dec',src:'Indicador 8',x:'Ubica, representa y ordena números decimales en la recta numérica, reconociendo su posición y la relación de mayor, menor o igual.'},
 D5:{t:'dec',src:'Aprendizaje esperado 13 + Indicador 9',x:'Comparar y ordenar números decimales hasta la milésima con los signos >, < o =, según el valor posicional de sus cifras.'},
 G1:{t:'cua',src:'Aprendizaje esperado 6',x:'Identificar diversos elementos de los cuadriláteros (lado, vértice, ángulo, base, altura, diagonal).'},
 G2:{t:'cua',src:'Aprendizaje esperado 7',x:'Clasificar cuadriláteros en paralelogramos y no paralelogramos.'},
 G3:{t:'cua',src:'Aprendizaje esperado 8',x:'Clasificar paralelogramos en cuadrado, rectángulo, rombo y romboide.'},
 G4:{t:'cua',src:'Aprendizaje esperado 11',x:'Reconocer propiedades de cuadriláteros referidas a los lados, los ángulos y las diagonales.'},
 G5:{t:'cua',src:'Aprendizaje esperado 12 (y 8)',x:'Clasificar los cuadriláteros no paralelogramos en trapecios y trapezoides.'},
 G6:{t:'cua',src:'Aprendizaje esperado 13',x:'Identificar estas figuras y sus elementos (vértices, lados, ángulos) en objetos del entorno.'},
 G7:{t:'cua',src:'Indicador 10',x:'Clasifica cuadriláteros según sus características: paralelogramos y no paralelogramos, identificando cuadrados, rectángulos, rombos, romboides, trapecios y trapezoides a partir de sus lados, ángulos y elementos.'}
};

/* =========================================================
   2. AYUDAS GRÁFICAS (SVG / HTML)
   ========================================================= */
const F=(n,d)=>`<span class="fr" role="img" aria-label="${n} sobre ${d}"><span>${n}</span><span>${d}</span></span>`;
const fmt=v=>String(+(+v).toFixed(4)).replace('.',',');
const svgW=(w,h,inner,alt)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${alt}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const PAL=['#fb8c00','#43a047','#1e88e5','#e91e63','#7e57c2','#00acc1'];

function fracBars(list,alt){ // list: [n,d,label]
  const rowH=44, w=360, off=list.some(l=>l[2])?90:10; let s='';
  list.forEach(([n,d,lab],r)=>{
    const y=10+r*rowH, pw=(w-off-10)/d;
    for(let i=0;i<d;i++) s+=`<rect x="${off+i*pw}" y="${y}" width="${pw}" height="32" fill="${i<n?'#29b6f6':'#fff'}" stroke="#0d47a1" stroke-width="2.5"/>`;
    if(lab) s+=`<text x="8" y="${y+22}" class="svgt">${lab}</text>`;
  });
  return svgW(w+10,list.length*rowH+14,s,alt);
}
function pie(n,d,alt){
  const cx=110,cy=100,r=80; let s='';
  for(let i=0;i<d;i++){
    const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${i<n?'#ff8a65':'#fff'}" stroke="#0d47a1" stroke-width="2.5"/>`;
  }
  return svgW(220,200,s,alt).replace('class="fig"','class="fig" style="max-width:260px"');
}
function coll(n,tot,alt){
  let s=''; const per=Math.min(tot,8);
  for(let i=0;i<tot;i++){const r=Math.floor(i/per),c=i%per; s+=`<circle cx="${34+c*50}" cy="${30+r*50}" r="19" fill="${i<n?'#ffb300':'#fff'}" stroke="#e65100" stroke-width="3"/>`;}
  return svgW(per*50+20,Math.ceil(tot/per)*50+14,s,alt);
}
function numLine(a,b,div,pts,alt){
  const x0=36,x1=564,y=64,st=(x1-x0)/div; let s=`<line x1="${x0-14}" y1="${y}" x2="${x1+14}" y2="${y}" stroke="#16213e" stroke-width="3"/>`;
  for(let i=0;i<=div;i++){const x=x0+i*st,m=(i===0||i===div);s+=`<line x1="${x}" y1="${y-(m?14:9)}" x2="${x}" y2="${y+(m?14:9)}" stroke="#16213e" stroke-width="${m?3:2}"/>`;}
  s+=`<text x="${x0}" y="${y+34}" text-anchor="middle" class="svgt">${fmt(a)}</text><text x="${x1}" y="${y+34}" text-anchor="middle" class="svgt">${fmt(b)}</text>`;
  pts.forEach(p=>{const x=x0+(p.v-a)/(b-a)*(x1-x0);s+=`<circle cx="${x}" cy="${y}" r="9" fill="#e91e63" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y-18}" text-anchor="middle" class="svgt" style="font-size:17px">${p.l}</text>`;});
  return svgW(600,110,s,alt);
}
function sqFigs(figs,alt){
  const sz=20,g=4,gap=40; let x=12,s='',mh=0;
  figs.forEach((rows,i)=>{
    const w=Math.max(...rows)*(sz+g);
    rows.forEach((n,r)=>{for(let c=0;c<n;c++)s+=`<rect x="${x+c*(sz+g)}" y="${34+r*(sz+g)}" width="${sz}" height="${sz}" rx="3" fill="#ffb300" stroke="#e65100" stroke-width="2"/>`;});
    s+=`<text x="${x+w/2}" y="20" text-anchor="middle" class="svgt">Figura ${i+1}</text>`;
    x+=w+gap; mh=Math.max(mh,rows.length*(sz+g));
  });
  return svgW(x,34+mh+10,s,alt);
}
function barChart(data,o={}){
  const W=440,H=280,L=46,B=44,T=36,R=10,max=o.max,step=o.step; let s='';
  if(o.title)s+=`<text x="${W/2}" y="20" text-anchor="middle" class="svgt" style="font-size:15px">${o.title}</text>`;
  for(let v=0;v<=max;v+=step){const y=T+(H-T-B)*(1-v/max);s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#cfd8dc" stroke-width="1.5"/><text x="${L-7}" y="${y+4}" text-anchor="end" class="svgs">${v}</text>`;}
  const bw=(W-L-R)/data.length;
  data.forEach(([lab,val],i)=>{const h=(H-T-B)*val/max,x=L+i*bw+bw*.2,y=H-B-h;
    s+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="4" fill="${PAL[i%6]}" stroke="#16213e" stroke-width="2"/><text x="${x+bw*.3}" y="${y-6}" text-anchor="middle" class="svgt">${val}</text><text x="${x+bw*.3}" y="${H-B+18}" text-anchor="middle" class="svgs">${lab}</text>`;});
  s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#16213e" stroke-width="2.5"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#16213e" stroke-width="2.5"/>`;
  if(o.yl)s+=`<text x="12" y="${(T+H-B)/2}" transform="rotate(-90 12 ${(T+H-B)/2})" text-anchor="middle" class="svgs">${o.yl}</text>`;
  return svgW(W,H,s,'Gráfico de barras'+(o.title?': '+o.title:'')+'. '+data.map(d=>d[0]+' '+d[1]).join(', '));
}
function picto(rows,emoji,per,title){
  const alt=title+'. '+rows.map(r=>r[0]+' '+r[1]+' símbolos').join(', ')+`. Cada símbolo vale ${per}.`;
  return `<div class="picto" role="img" aria-label="${alt}"><strong>${title}</strong><table aria-hidden="true">${rows.map(r=>`<tr><th>${r[0]}</th><td>${emoji.repeat(r[1])}</td></tr>`).join('')}</table><p class="legend" aria-hidden="true">Cada ${emoji} = ${per} estudiantes</p></div>`;
}
function tbl(head,rows,cap){return `<table class="tbl"><caption>${cap}</caption><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')}</tr>`).join('')}</tbody></table>`;}

function rmark(p,u,v,k=12){return `<path d="M${p[0]+u[0]*k} ${p[1]+u[1]*k}L${p[0]+u[0]*k+v[0]*k} ${p[1]+u[1]*k+v[1]*k}L${p[0]+v[0]*k} ${p[1]+v[1]*k}" fill="none" stroke="#d81b60" stroke-width="2.5"/>`;}
function quad(pts,alt,o={}){
  const lab=o.labels===false?null:(o.labels||['A','B','C','D']);
  const cx=pts.reduce((a,p)=>a+p[0],0)/4, cy=pts.reduce((a,p)=>a+p[1],0)/4; let s='';
  s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.5" stroke-linejoin="round"/>`;
  (o.diag||[]).forEach(([i,j])=>{s+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="#d81b60" stroke-width="2.5" stroke-dasharray="7 5"/>`;});
  (o.right||[]).forEach(i=>{const p=pts[i],a=pts[(i+3)%4],b=pts[(i+1)%4];const ua=[a[0]-p[0],a[1]-p[1]],ub=[b[0]-p[0],b[1]-p[1]];const la=Math.hypot(...ua),lb=Math.hypot(...ub);s+=rmark(p,[ua[0]/la,ua[1]/la],[ub[0]/lb,ub[1]/lb]);});
  (o.ticks||[]).forEach(([k,n])=>{const a=pts[k],b=pts[(k+1)%4],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,tx=dx/L,ty=dy/L;
    for(let t=0;t<n;t++){const off=(t-(n-1)/2)*6;s+=`<line x1="${mx+tx*off+nx*7}" y1="${my+ty*off+ny*7}" x2="${mx+tx*off-nx*7}" y2="${my+ty*off-ny*7}" stroke="#d81b60" stroke-width="2.5"/>`;}});
  if(o.height){const [a,b,l]=o.height;s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#d81b60" stroke-width="2.5" stroke-dasharray="7 5"/>`+rmark(b,[0,-1],[1,0],11)+`<text x="${a[0]+9}" y="${(a[1]+b[1])/2+5}" class="svgt" style="font-size:16px;fill:#d81b60">${l}</text>`;}
  if(lab)pts.forEach((p,i)=>{const dx=p[0]-cx,dy=p[1]-cy,L=Math.hypot(dx,dy);s+=`<text x="${p[0]+dx/L*15}" y="${p[1]+dy/L*15+5}" text-anchor="middle" class="svgt" style="font-size:16px">${lab[i]}</text>`;});
  return svgW(250,175,s,alt);
}

const TOPICS=[
{id:'suc',n:'Sucesiones y patrones',ic:'🔢',s:'Encuentra la regla y completa los términos',
 les:`<div class="defs">
 <div><b>Sucesión</b>: lista ordenada de números o figuras que sigue una <b>regla</b> (patrón).</div>
 <div><b>Término</b>: cada elemento de la sucesión (1.º, 2.º, 3.º…).</div>
 <div><b>Regla aditiva</b>: se suma o resta siempre lo mismo (+5, −1 000).</div>
 <div><b>Regla multiplicativa</b>: se multiplica siempre por lo mismo (×2).</div></div>
 <ul><li><b>Paso 1:</b> resta dos términos seguidos para hallar la diferencia (ej.: 300 000 − 200 000 = 100 000).</li>
 <li><b>Paso 2:</b> comprueba que la <b>misma regla</b> funcione en todos los términos.</li>
 <li><b>Paso 3:</b> usa la regla para completar términos faltantes o hallar uno más lejano.</li>
 <li>En <b>figuras</b>: cuenta cuántos cuadritos hay en cada una y mira cuánto crece.</li>
 <li>En <b>tablas</b>: mira cómo cambia el valor cuando la posición sube 1.</li></ul>
 ${sqFigs([[1,1],[2,2],[3,3]],'Figuras de 2, 4 y 6 cuadrados.')}
 <div class="tip">💡 Trabajamos con números naturales menores que <b>1 000 000</b>. Si el patrón sube de 100 en 100, solo cambia la cifra de las centenas.</div>`},
{id:'est',n:'Estadística',ic:'📊',s:'Tablas, gráficos, datos y fuentes',
 les:`<div class="defs">
 <div><b>Dato cualitativo</b>: describe una cualidad (color, sabor, nombre).</div>
 <div><b>Dato cuantitativo</b>: es un número (edad, cantidad, estatura).</div>
 <div><b>Por conteo</b>: respondemos "¿cuántos?" contando (goles, hermanos).</div>
 <div><b>Por medición</b>: usamos un instrumento (cinta métrica, balanza, termómetro).</div></div>
 <ul><li><b>Fuentes</b> de datos: encuestas, entrevistas, observación, mediciones y registros.</li>
 <li><b>Posibles errores</b>: anotar mal, contar de más o de menos, instrumento dañado, preguntar solo a un grupo (no representa a todos).</li>
 <li>Para leer un <b>gráfico</b>: lee el título, mira los ejes y la escala, y luego compara las barras.</li>
 <li>En un <b>pictograma</b>, multiplica el número de símbolos por lo que vale cada uno.</li></ul>
 ${BAR_PETS}
 <div class="tip">💡 ¿Cantidad que se cuenta o se mide? Pregúntate: ¿necesito un instrumento? Sí → medición. No, solo contar → conteo.</div>`},
{id:'fra',n:'Fracciones',ic:'🍕',s:'Partes de un entero, propias, impropias y comparar',
 les:`<div class="defs">
 <div><b>Numerador</b> (arriba): partes que se toman.</div>
 <div><b>Denominador</b> (abajo): partes <b>iguales</b> en que se divide el entero.</div>
 <div><b>Propia</b>: numerador &lt; denominador (vale menos que 1).</div>
 <div><b>Impropia</b>: numerador ≥ denominador (vale 1 o más).</div></div>
 ${fracBars([[3,5,'3/5']],'Barra con 3 de 5 partes sombreadas.')}
 <ul><li>Una fracción también puede ser parte de una <b>colección</b>: 3 de 8 fichas = 3/8.</li>
 <li><b>Mismo denominador:</b> es mayor la de mayor numerador (3/7 &lt; 5/7).</li>
 <li><b>Mismo numerador:</b> es mayor la de <b>menor</b> denominador (4/5 &gt; 4/9).</li>
 <li>Apóyate en dibujos: dos barras iguales te muestran quién es más grande.</li>
 <li>Símbolos: <b>&lt;</b> menor que · <b>&gt;</b> mayor que · <b>=</b> igual. La "boca" se abre hacia el número mayor.</li></ul>
 <div class="tip">💡 Las partes siempre deben ser <b>iguales</b>; si no, no es una fracción.</div>`},
{id:'dec',n:'Números decimales',ic:'🔟',s:'Leer, escribir, ubicar y comparar hasta milésimas',
 les:`${tbl(['Unidades','Décimas','Centésimas','Milésimas'],[['3 ,','4','2','5']],'El número 3,425 en la tabla de valor posicional')}
 <ul><li>3,425 se lee: <b>3 enteros con 425 milésimas</b>. Parte entera = 3; parte decimal = 425 milésimas.</li>
 <li>Décimas = 0,1 · Centésimas = 0,01 · Milésimas = 0,001.</li>
 <li>Para <b>comparar</b>: primero la parte entera; si es igual, décimas; luego centésimas; luego milésimas.</li>
 <li>Iguala las cifras con ceros: 0,5 = 0,50 = 0,500 (¡no cambia su valor!).</li>
 <li><b>Recta numérica:</b> si el decimal es 3,6 está entre los naturales 3 y 4. Divide el tramo en 10 partes y cada una vale 0,1.</li>
 <li>Ordenar: ubica los números y el que queda más a la derecha es el mayor.</li></ul>
 ${numLine(3,4,10,[{v:3.6,l:'3,6'}],'Recta de 3 a 4 con el punto 3,6.')}
 <div class="tip">💡 4,59 &lt; 4,6 porque 4,6 = 4,60 y 59 &lt; 60. ¡No importa cuántas cifras tenga, importa el valor posicional!</div>`},
{id:'cua',n:'Cuadriláteros',ic:'⬛',s:'Elementos, clasificación y propiedades',
 les:`<div class="defs">
 <div><b>Elementos</b>: 4 lados, 4 vértices, 4 ángulos y 2 diagonales. Base y altura (perpendicular a la base).</div>
 <div><b>Paralelogramos</b>: 2 pares de lados paralelos → cuadrado, rectángulo, rombo, romboide.</div>
 <div><b>No paralelogramos</b>: trapecio (1 par de lados paralelos) y trapezoide (ninguno).</div></div>
 ${tbl(['Figura','Lados','Ángulos','Diagonales'],[
 ['Cuadrado','4 iguales','4 rectos','Iguales y perpendiculares'],
 ['Rectángulo','Opuestos iguales','4 rectos','Iguales'],
 ['Rombo','4 iguales','Opuestos iguales (no rectos)','Perpendiculares'],
 ['Romboide','Opuestos iguales','Opuestos iguales (no rectos)','Ni iguales ni perpendiculares'],
 ['Trapecio','1 par paralelo','—','—'],
 ['Trapezoide','Sin paralelos','—','—']],'Propiedades de los cuadriláteros')}
 <ul><li>Todo cuadrado es rectángulo y rombo, pero no al revés.</li>
 <li><b>En el entorno:</b> puerta/ventana → rectángulo · baldosa → cuadrado · cometa → trapezoide · cubierta de mesa con 2 lados paralelos → trapecio.</li></ul>
 <div class="tip">💡 El temario dice "trapecio, trapezoide" al clasificar paralelogramos: son los <b>no paralelogramos</b>. Los paralelogramos son cuadrado, rectángulo, rombo y romboide.</div>`}
];
const TM=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const LV=['','🔰 Conocimiento','🛠️ Aplicación','🧠 Resolución de problemas'];
const LVD=['','Reconoce, nombra y recuerda','Usa lo aprendido en ejercicios','Analiza y resuelve situaciones'];

/* =========================================================
   5. ESTADO, UTILIDADES, SONIDO
   ========================================================= */
const KEY='matekart4-v1';
let S={name:'',hue:0,coins:0,best:{},set:{snd:true,fs:18,hc:false,rm:false}};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x,{set:Object.assign(S.set,x.set||{})});}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const nb=h=>h.replace(/(\d) (?=\d{3}(?!\d))/g,'$1 ');
let AC=null;
function beep(seq){if(!S.set.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9;});}catch(e){}}
function applySet(){
  document.documentElement.style.setProperty('--fs',S.set.fs+'px');
  document.documentElement.classList.toggle('hc',!!S.set.hc);
  document.documentElement.classList.toggle('rm',!!S.set.rm);
  $('#bSnd').setAttribute('aria-pressed',S.set.snd);$('#bSnd').textContent=S.set.snd?'🔊':'🔇';$('#bSnd').setAttribute('aria-label',S.set.snd?'Sonido activado':'Sonido desactivado');
  $('#bHc').setAttribute('aria-pressed',!!S.set.hc);$('#bRm').setAttribute('aria-pressed',!!S.set.rm);
  $('#coins').textContent='🪙 '+S.coins;
}
$('#bSnd').onclick=()=>{S.set.snd=!S.set.snd;save();applySet();};
$('#bSmall').onclick=()=>{S.set.fs=Math.max(14,S.set.fs-2);save();applySet();};
$('#bBig').onclick=()=>{S.set.fs=Math.min(28,S.set.fs+2);save();applySet();};
$('#bHc').onclick=()=>{S.set.hc=!S.set.hc;save();applySet();};
$('#bRm').onclick=()=>{S.set.rm=!S.set.rm;save();applySet();};
$('#logo').onclick=()=>{location.hash='#/home';};
const starsOf=k=>(S.best[k]||{s:0}).s;
const starStr=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const topicStars=id=>[1,2,3].reduce((a,l)=>a+starsOf(id+l),0);
const levelOf=p=>p>=85?'Avanzado':p>=65?'Intermedio':'Inicial';

/* =========================================================
   6. VISTAS
   ========================================================= */
let R=null;
function setView(html,focusSel){app.innerHTML=html;window.scrollTo({top:0});const f=focusSel?$(focusSel):app;if(f){f.setAttribute('tabindex','-1');f.focus({preventScroll:true});}}

function viewHome(){
  const total=TOPICS.reduce((a,t)=>a+topicStars(t.id),0)+starsOf('fin0');
  setView(`
  <section class="card hero" aria-labelledby="h1">
   <div>
    <h1 id="h1">¡Bienvenido al Gran Premio de Matemática! 🏆</h1>
    <p>Prepárate para la <b>segunda prueba del II semestre 2026</b> (miércoles 11 de noviembre). Recorre las 5 copas, aprende en el <b>Pit stop</b>, gana monedas y estrellas, y termina con el <b>Gran Premio final</b>.</p>
    <div class="row"><label for="nm"><b>Tu nombre de piloto:</b></label><input id="nm" value="${S.name.replace(/"/g,'&quot;')}" maxlength="20" style="font:inherit;padding:.5rem .7rem;border:3px solid var(--sky);border-radius:12px;min-height:44px">
    <label for="kc"><b>Color del kart:</b></label><input id="kc" type="range" min="0" max="360" value="${S.hue}" aria-label="Color del kart" style="min-height:44px"></div>
   </div>
   <div class="kart" id="kartv" style="filter:hue-rotate(${S.hue}deg) drop-shadow(0 8px 0 rgba(0,0,0,.18))" aria-hidden="true">🏎️</div>
  </section>
  <section aria-labelledby="h2"><h2 id="h2">🗺️ Elige tu copa · ⭐ ${total} / 48</h2>
   <div class="cups">
   ${TOPICS.map(t=>`<button class="cup ${t.id}" data-c="${t.id}" aria-label="Copa ${t.n}. ${topicStars(t.id)} de 9 estrellas"><span class="ic" aria-hidden="true">${t.ic}</span><b>Copa ${t.n}</b><span class="s">${t.s}</span><span class="stars" aria-hidden="true">${'⭐'.repeat(topicStars(t.id))||'☆☆☆'} <small>${topicStars(t.id)}/9</small></span></button>`).join('')}
   <button class="cup fin" id="fin" aria-label="Gran Premio final. Mejor resultado ${starsOf('fin0')} de 3 estrellas"><span class="ic" aria-hidden="true">🏆</span><b>Gran Premio final</b><span class="s">30 preguntas mezcladas de todo el temario, de fácil a difícil</span><span class="stars" aria-hidden="true">${starStr(starsOf('fin0'))}</span></button>
   </div></section>
  <section class="card" aria-labelledby="h3"><h3 id="h3">📋 ¿Cómo se organiza la práctica?</h3>
   <ul><li><b>Pit stop</b>: resumen con lo esencial de cada tema (¡de 0 a 100!).</li>
   <li><b>3 carreras por copa</b> con dificultad progresiva: 🔰 Conocimiento → 🛠️ Aplicación → 🧠 Resolución de problemas.</li>
   <li>Después de cada respuesta recibes una <b>explicación</b>, tanto si acertaste como si no.</li>
   <li>Niveles de desempeño: <b>Inicial</b> (menos de 65 %), <b>Intermedio</b> (65 % a 84 %) y <b>Avanzado</b> (85 % o más).</li></ul>
   <div class="row"><a class="btn ghost" href="#/audit">✅ Ver auditoría de cobertura del temario</a><button class="btn ghost" id="reset">🗑️ Borrar mi progreso</button></div>

  $('#nm').oninput=e=>{S.name=e.target.value;save();};

  $('#fin').onclick=()=>startRace('fin',0);

function viewCup(id){
  const t=TM[id];
  setView(`
  <p><a href="#/home">← Volver al mapa</a></p>
  <section class="card lesson" aria-labelledby="ch"><h2 id="ch">${t.ic} Copa ${t.n}</h2>
   <h3>🔧 Pit stop: lo que necesitas saber</h3>${t.les}</section>
  <section aria-labelledby="rc"><h2 id="rc">🏁 Carreras</h2>
   <div class="lv">${[1,2,3].map(l=>{const n=Q.filter(q=>q.t===id&&q.l===l).length;const b=S.best[id+l];return `<button class="lvbtn" data-l="${l}"><b>${LV[l]}</b><span>${LVD[l]} · ${n} preguntas</span><br><span aria-label="${starsOf(id+l)} de 3 estrellas">${starStr(starsOf(id+l))}</span>${b?` <span class="badge">${b.p}% · ${levelOf(b.p)}</span>`:''}</button>`;}).join('')}</div></section>`,'#ch');
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>startRace(id,+b.dataset.l));
}

function buildFinal(){
  const pool=shuffle(Q), picked=new Set(), cov=new Set();
  shuffle(Object.keys(OUT)).forEach(o=>{if(cov.has(o))return;const c=pool.find(q=>q.o.includes(o)&&!picked.has(q));if(c){picked.add(c);c.o.forEach(x=>cov.add(x));}});
  const ids=TOPICS.map(t=>t.id);let i=0,guard=0;
  while(picked.size<30&&guard++<500){const t=ids[i++%5];const c=pool.find(q=>q.t===t&&!picked.has(q));if(c)picked.add(c);}
  return [...picked].sort((a,b)=>a.l-b.l||Math.random()-.5);
}
function startRace(t,l,custom){
  const qs=custom||(t==='fin'?buildFinal():shuffle(Q.filter(q=>q.t===t&&q.l===l)));
  R={t,l,qs,i:0,score:0,wrong:[],done:false,locked:false,coins:0,key:t+l,custom:!!custom};
  if(location.hash==='#/race')route();else location.hash='#/race';
}

function viewRace(){
  if(!R){location.hash='#/home';return;}
  const q=R.qs[R.i],n=R.qs.length,pct=R.i/n*86;
  const head=R.t==='fin'?'🏆 Gran Premio final':`${TM[R.t].ic} ${TM[R.t].n} · ${LV[R.l]}`;
  let body='';
  if(q.k==='mc'){
    R.order=shuffle(q.ch.map((h,i)=>({h,ok:i===0})));
    body=`<div class="choices" role="group" aria-labelledby="qt">${R.order.map((o,i)=>`<button class="ch" data-i="${i}"><span class="l" aria-hidden="true">${'ABCD'[i]}</span><span>${nb(o.h)}</span></button>`).join('')}</div>`;
  }else{
    body=`<form class="ans" id="af" autocomplete="off"><label for="ai">Escribe tu respuesta:</label><input id="ai" inputmode="text" aria-describedby="ah"><button class="btn go" type="submit">Comprobar ✔</button><p class="hint" id="ah">Escribe solo el número (por ejemplo 7000, 2,5 o 3/4). No hace falta poner unidades.</p></form>`;
  }
  setView(`
  <div class="hud"><button class="btn ghost" id="quit" style="min-height:44px;padding:.4rem .9rem">✖ Salir</button><b>${head}</b><span class="grow" style="flex:1"></span><span class="badge" aria-live="polite">Pregunta ${R.i+1} de ${n}</span><span class="badge">🪙 ${R.coins}</span></div>
  <div class="track" aria-hidden="true"><span class="k" style="left:${pct}%;--hue:${S.hue}deg">🏎️</span><span class="flag">🏁</span></div>
  <section class="card" aria-labelledby="qt">
   <div class="qtag"><span class="badge">${LV[q.l]||'Gran Premio'}</span>${q.o.map(o=>`<span class="badge" title="${OUT[o].x}">${o}</span>`).join('')}</div>
   <h2 class="qtext" id="qt" tabindex="-1">${nb(q.q)}</h2>
   ${q.fig}${body}
   <div class="fb" id="fb" role="status" aria-live="polite"></div>
   <div class="row" style="margin-top:1rem"><button class="btn gold" id="next" hidden>${R.i+1<n?'Siguiente ▶':'Ver resultado 🏆'}</button></div>
  </section>`,'#qt');
  $('#quit').onclick=()=>{if(confirm('¿Salir de la carrera? Perderás el avance de esta práctica.')){const t=R.t;R=null;location.hash=t==='fin'?'#/home':'#/cup/'+t;}};
  R.locked=false;
  if(q.k==='mc')app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  else{$('#af').onsubmit=e=>{e.preventDefault();const v=$('#ai').value.trim();if(!v){$('#ai').focus();return;}answer(v);};}
}
const norm=s=>{s=String(s).toLowerCase().replace(/[₡\s]/g,'').replace(/colones|cm|m|km|l|litros|panes|p[aá]ginas|sillas|personas|libros|bolas|estudiantes|votos|cuadrados/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return s.replace('.',',');};
function answer(v){
  if(R.locked)return;R.locked=true;
  const q=R.qs[R.i];let ok,shown;
  if(q.k==='mc'){
    ok=R.order[v].ok;
    app.querySelectorAll('.ch').forEach((b,i)=>{b.disabled=true;if(R.order[i].ok){b.classList.add('right');b.insertAdjacentHTML('beforeend','<b aria-label="respuesta correcta"> ✔</b>');}else if(i===v){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<b aria-label="tu respuesta, incorrecta"> ✖</b>');}});
    shown=nb(R.order.find(o=>o.ok).h);
  }else{
    ok=q.acc.map(norm).includes(norm(v));
    $('#ai').disabled=true;$('#af').querySelector('button').disabled=true;
    shown=q.acc[0].replace(/^(\d+)$/,(m)=>m.length>3?m.replace(/\B(?=(\d{3})+(?!\d))/g,' '):m);
  }
  const fb=$('#fb');
  if(ok){R.score++;R.coins+=10;S.coins+=10;beep([[660,.1],[880,.15],[1180,.2]]);
    fb.className='fb show ok';fb.innerHTML=`<h3>🏁 ¡Correcto! +10 🪙</h3><p>${nb(q.e)}</p>`;}
  else{R.wrong.push({q,v:q.k==='mc'?nb(R.order[v].h):v,right:shown});beep([[300,.18],[220,.25]]);
    fb.className='fb show no';fb.innerHTML=`<h3>💥 ¡Casi! Aprendamos de esto</h3><p><b>Respuesta correcta:</b> ${shown}</p><p><b>¿Por qué?</b> ${nb(q.e)}</p>`;}
  applySet();save();
  const nx=$('#next');nx.hidden=false;nx.focus();
  nx.onclick=()=>{R.i++;if(R.i<R.qs.length)viewRace();else finish();};
  $('.track .k').style.left=((R.i+1)/R.qs.length*86)+'%';
}
function finish(){
  R.done=true;const p=Math.round(R.score/R.qs.length*100),st=p>=85?3:p>=65?2:p>=40?1:0;R.p=p;R.st=st;
  if(!R.custom){const b=S.best[R.key];if(!b||p>b.p||st>b.s)S.best[R.key]={p:Math.max(p,b?b.p:0),s:Math.max(st,b?b.s:0)};}
  save();applySet();
  location.hash='#/result';
}
function viewResult(){

  $('#again').onclick=()=>startRace(R.t,R.l);
  if($('#rw'))$('#rw').onclick=()=>{const qs=R.wrong.map(w=>w.q),t=R.t,l=R.l;startRace(t,l,shuffle(qs));};
  $('#back').onclick=()=>{const t=R.t;R=null;location.hash=t==='fin'?'#/home':'#/cup/'+t;};
  beep([[523,.12],[659,.12],[784,.12],[1047,.3]]);
}

function viewAudit(){
  const ids=Object.keys(OUT);const cnt=o=>{const r={1:0,2:0,3:0,all:0};Q.forEach(q=>{if(q.o.includes(o)){r[q.l]++;r.all++;}});return r;};
  const covered=ids.filter(o=>cnt(o).all>0).length;
  const full=ids.filter(o=>{const c=cnt(o);return c[1]&&c[2]+c[3];}).length;
  setView(`
  <p><a href="#/home">← Volver al mapa</a></p>
  <section class="card" aria-labelledby="ah"><h2 id="ah">✅ Auditoría de cobertura del temario</h2>
   <p>Cada aprendizaje esperado e indicador de las hojas del <b>Temas de Examen Segunda Prueba, II semestre 2026</b> tiene un código (S, E, F, D, G) y se verifica que existan preguntas en la práctica.</p>
   <p><b>Resultado:</b> <span class="okc">${covered} de ${ids.length}</span> contenidos cubiertos · <span class="okc">${full} de ${ids.length}</span> con preguntas de conocimiento y también de aplicación/problemas · <b>${Q.length}</b> preguntas en total.</p>
   <div class="scroll"><table class="aud"><thead><tr><th>Cód.</th><th>Contenido del temario</th><th>Origen</th><th>🔰</th><th>🛠️</th><th>🧠</th><th>Estado</th></tr></thead><tbody>
   ${ids.map(o=>{const c=cnt(o);return `<tr><td><b>${o}</b></td><td>${OUT[o].x}<br><small>Copa ${TM[OUT[o].t].n}</small></td><td>${OUT[o].src}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td class="${c.all?'okc':''}">${c.all?'✔ Cubierto':'✖ FALTA'}</td></tr>`;}).join('')}
   </tbody></table></div></section>
  <section class="card"><h3>🔎 Observaciones sobre el documento del temario</h3>
   <ul><li>La foto del documento corta la tabla entre las hojas 1 y 2: la primera fila visible de la hoja 2 (leer y escribir decimales hasta la milésima) y la numeración "13." y "5." quedan sin los encabezados completos. Se cubrió todo lo legible de las dos hojas; si hay una fila de más arriba o abajo de lo fotografiado, indícalo para agregarla.</li>
   <li>El aprendizaje 8 de cuadriláteros dice "paralelogramos en cuadrado, rectángulo, rombo, romboide, <i>trapecio, trapezoide</i>"; el trapecio y el trapezoide <b>no son paralelogramos</b>, así que se practican bajo el aprendizaje 12 y el indicador 10.</li>
   <li>Las fracciones impropias (indicador 5) se practican como clasificación y representación; el temario no menciona números mixtos ni fracciones equivalentes como contenido, por eso solo se usan como apoyo visual.</li></ul></section>`,'#ah');
}

function route(){
  const h=location.hash.replace(/^#\/?/,''),[r,a]=h.split('/');
  if(r==='cup'&&TM[a])viewCup(a);
  else if(r==='race'&&R&&!R.done)viewRace();
  else if(r==='result'&&R&&R.done)viewResult();
  else if(r==='audit')viewAudit();
  else viewHome();
}
window.addEventListener('hashchange',route);
applySet();route();
</script>
